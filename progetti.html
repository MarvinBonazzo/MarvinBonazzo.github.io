<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutti i progetti — Marvin Bonazzo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/transition.js"></script>
<style>
  header { padding: 8vh 0 6vh; }
  header h1 { font-weight: 300; font-size: clamp(2.6rem, 7vw, 5rem); line-height: 1; margin-top: 12px; color: rgba(59,53,45,.88); }
  .list { list-style: none; display: grid; gap: 14px; }
  .group { display: grid; gap: 14px; padding-bottom: 8vh; }
  .group-head { display: grid; gap: 6px; padding: 0 6px 4px; }
  .group-head h2 { font-weight: 400; font-size: 1.05rem; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .group-head h2 a { text-decoration: none; }
  .group-head h2 a:hover { text-decoration: underline; text-underline-offset: 4px; }
  .group-head p { color: var(--ink-mid); font-size: 1.05rem; max-width: 60ch; }
  .item a {
    display: grid; grid-template-columns: 56px 180px 1fr auto; gap: 26px; align-items: center;
    padding: 14px 26px 14px 14px; border-radius: 22px; text-decoration: none; transition: transform .25s;
  }
  .item a:hover { transform: translateX(6px); }
  .item .num { font-size: .8rem; letter-spacing: .2em; color: var(--ink-soft); text-align: center; }
  .item img { width: 180px; aspect-ratio: 16/10; object-fit: cover; object-position: top; border-radius: 12px; }
  .item h2 { font-weight: 400; font-size: 1.6rem; }
  .item p { margin-top: 4px; color: var(--ink-mid); font-size: 1.05rem; line-height: 1.45; max-width: 60ch; }
  .item .go { font-size: 1.3rem; color: var(--ink-soft); }
  @media (max-width: 760px) {
    .group { display: grid; gap: 14px; padding-bottom: 8vh; }
  .group-head { display: grid; gap: 6px; padding: 0 6px 4px; }
  .group-head h2 { font-weight: 400; font-size: 1.05rem; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .group-head h2 a { text-decoration: none; }
  .group-head h2 a:hover { text-decoration: underline; text-underline-offset: 4px; }
  .group-head p { color: var(--ink-mid); font-size: 1.05rem; max-width: 60ch; }
  .item a { grid-template-columns: 96px 1fr; gap: 16px; padding: 10px 16px 10px 10px; }
    .item .num, .item .go { display: none; }
    .item img { width: 96px; aspect-ratio: 1; border-radius: 10px; }
    .item h2 { font-size: 1.25rem; }
    .item p { font-size: .95rem; }
  }
</style>
</head>
<body>
<div class="blob a"></div><div class="blob b"></div>

<nav class="topbar">
  <a class="pill glass" href="./">← Portfolio</a>
</nav>

<main class="wrap">
  <header>
    <div class="eyebrow">Indice</div>
    <h1>Tutti i progetti</h1>
  </header>
  <div id="groups"></div>
</main>

<script src="assets/projects.js"></script>
<script>
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const item = p => `
    <li class="item"><a class="glass" href="progetto.html#${p.slug}">
      <span class="num">${String(window.PROJECTS.indexOf(p) + 1).padStart(2, '0')}</span>
      <img src="${p.cover}" alt="" loading="lazy">
      <div><h2>${esc(p.name)}</h2><p>${esc(p.short)}</p></div>
      <span class="go">→</span>
    </a></li>`;
  document.getElementById('groups').innerHTML = Object.entries(window.CATEGORIES).map(([key, c]) => `
    <section class="group">
      <div class="group-head"><h2><a href="cartella.html#${key}">${esc(c.name)}</a></h2><p>${esc(c.text)}</p></div>
      <ul class="list">${window.PROJECTS.filter(p => p.category === key).map(item).join('')}</ul>
    </section>`).join('');
</script>
</body>
</html>
